name: 'Canvas starter'
description: 'Installs Drupal Canvas with its AI agents, dev tooling, and OAuth so the Canvas CLI (npx canvas login / npx canvas push) works out of the box.'
type: 'Site'
recipes:
  # `canvas login`'s default scope request includes `canvas:media:image:create`,
  # which canvas_oauth only creates once an "image" media type exists. The
  # `standard` install profile doesn't provide one on its own.
  - core/recipes/image_media_type
install:
  - canvas
  - canvas_ai
  - canvas_dev_ai
  - canvas_dev_mode
  - canvas_oauth
  - ai
  - ai_agents
  - ai_provider_openai
  - pathauto
  - simple_oauth
  # Canvas pages render inside the front-end theme. Olivero's grid, containers
  # and typography squeeze Tailwind-styled code components into narrow
  # columns, so the site uses this project's own bare theme instead (see
  # web/themes/custom/canvas_starter_theme).
  - canvas_starter_theme
config:
  # Modules installed by a recipe only get their *simple* config (settings
  # objects) by default; config entities from their config/install/ -- image
  # styles, text formats, AI agents, OAuth scopes and token bundles -- are
  # skipped unless imported explicitly here. Without this, pushing any
  # component with an image prop fails on the missing
  # `canvas_parametrized_width` image style.
  import:
    canvas: '*'
    canvas_ai: '*'
    canvas_dev_ai: '*'
    canvas_dev_mode: '*'
    canvas_oauth: '*'
    ai: '*'
    ai_agents: '*'
    ai_provider_openai: '*'
    pathauto: '*'
    simple_oauth: '*'
    consumers: '*'
  actions:
    system.theme:
      simpleConfigUpdate:
        default: canvas_starter_theme
